name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test all frontend files
        run: node --test tests/*.test.mjs
      - name: Build
        run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: python:3.12-bookworm
    services:
      db_test:
        image: postgres:17
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: test_db
        options: >-
          --health-cmd "pg_isready -U test_user -d test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://test_user:test_pass@db_test:5432/test_db
      SECRET_KEY: ci-only-test-key
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - name: Create Python environment and install dependencies
        run: |
          python -m venv /tmp/tabulae-ci-venv
          /tmp/tabulae-ci-venv/bin/python -m pip install -r requirements.txt
      - name: Validate Python syntax
        run: /tmp/tabulae-ci-venv/bin/python -m compileall -q app
      - name: Test backend
        run: /tmp/tabulae-ci-venv/bin/python -m pytest -q app/tests
